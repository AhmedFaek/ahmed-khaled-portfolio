<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#858A93"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#7DA5C9"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="760" fill="#101113"/>

  <!-- Header -->
  <text x="40" y="46" fill="#E8E9EB" font-size="22" font-weight="700" letter-spacing="-0.3">StarDewedar — Layered Backend Architecture &amp; Request Lifecycle</text>
  <text x="40" y="70" fill="#858A93" font-size="14">Verified request path across Client → Routes → Middleware → Controller → Service → Repository → Prisma → PostgreSQL + External APIs</text>

  <!-- ==================== 1. CLIENTS ==================== -->
  <rect x="35" y="100" width="180" height="390" rx="10" fill="#15171B" stroke="#858A93" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="125" y="128" fill="#7DA5C9" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0.8">CLIENTS (REACT)</text>

  <rect x="50" y="150" width="150" height="135" rx="8" fill="#181C22" stroke="#7DA5C9" stroke-width="1.6"/>
  <text x="125" y="180" fill="#E8E9EB" font-size="14" font-weight="700" text-anchor="middle">Public Website</text>
  <text x="125" y="202" fill="#7DA5C9" font-size="12.5" text-anchor="middle">frontend/ (Port 3000)</text>
  <text x="125" y="224" fill="#B6BAC2" font-size="12" text-anchor="middle">• Bilingual EN / AR RTL</text>
  <text x="125" y="243" fill="#B6BAC2" font-size="12" text-anchor="middle">• Catalog &amp; Requests</text>
  <text x="125" y="262" fill="#B6BAC2" font-size="12" text-anchor="middle">• Customer Support Chat</text>

  <rect x="50" y="320" width="150" height="145" rx="8" fill="#181C22" stroke="#7DA5C9" stroke-width="1.6"/>
  <text x="125" y="350" fill="#E8E9EB" font-size="14" font-weight="700" text-anchor="middle">Admin Dashboard</text>
  <text x="125" y="372" fill="#7DA5C9" font-size="12.5" text-anchor="middle">admin/ (Port 3001)</text>
  <text x="125" y="394" fill="#B6BAC2" font-size="12" text-anchor="middle">• Super Admin</text>
  <text x="125" y="413" fill="#B6BAC2" font-size="12" text-anchor="middle">• Catalog Manager</text>
  <text x="125" y="432" fill="#B6BAC2" font-size="12" text-anchor="middle">• Sales/Support Manager</text>

  <!-- ==================== 2. EXPRESS LAYERED BACKEND ==================== -->
  <rect x="240" y="100" width="925" height="390" rx="10" fill="#15171B" stroke="#7DA5C9" stroke-width="1.2"/>
  <text x="260" y="128" fill="#7DA5C9" font-size="13.5" font-weight="700" letter-spacing="0.8">EXPRESS BACKEND PIPELINE (backend/src/app.js — Port 5000)</text>

  <!-- Routes -->
  <rect x="260" y="150" width="135" height="315" rx="8" fill="#16181D" stroke="#7DA5C9" stroke-width="1.6"/>
  <text x="327" y="178" fill="#E8E9EB" font-size="14" font-weight="700" text-anchor="middle">Routes</text>
  <text x="327" y="196" fill="#7DA5C9" font-size="11.5" text-anchor="middle">*.routes.js</text>
  <text x="274" y="224" fill="#B6BAC2" font-size="12">/api/auth</text>
  <text x="274" y="244" fill="#B6BAC2" font-size="12">/api/categories</text>
  <text x="274" y="264" fill="#B6BAC2" font-size="12">/api/products</text>
  <text x="274" y="284" fill="#B6BAC2" font-size="12">/api/projects</text>
  <text x="274" y="304" fill="#B6BAC2" font-size="12">/api/quotes</text>
  <text x="274" y="324" fill="#B6BAC2" font-size="12">/api/visits</text>
  <text x="274" y="344" fill="#B6BAC2" font-size="12">/api/boq</text>
  <text x="274" y="364" fill="#B6BAC2" font-size="12">/api/contact</text>
  <text x="274" y="384" fill="#B6BAC2" font-size="12">/api/conversations</text>
  <text x="274" y="404" fill="#B6BAC2" font-size="12">/api/dashboard</text>
  <text x="274" y="424" fill="#B6BAC2" font-size="12">/api/users</text>
  <text x="274" y="444" fill="#B6BAC2" font-size="12">/api/analytics</text>

  <!-- Middleware -->
  <rect x="420" y="150" width="185" height="315" rx="8" fill="#16181D" stroke="#7DA5C9" stroke-width="1.6"/>
  <text x="512" y="178" fill="#E8E9EB" font-size="14" font-weight="700" text-anchor="middle">Middleware</text>
  <text x="512" y="196" fill="#7DA5C9" font-size="11.5" text-anchor="middle">src/middleware/</text>

  <rect x="432" y="210" width="161" height="38" rx="5" fill="#1A222D" stroke="#858A93" stroke-width="1"/>
  <text x="512" y="227" fill="#E8E9EB" font-size="12" font-weight="600" text-anchor="middle">express-rate-limit</text>
  <text x="512" y="241" fill="#858A93" font-size="11" text-anchor="middle">Auth / Forms / Chat / Analytics</text>

  <rect x="432" y="256" width="161" height="44" rx="5" fill="#1A222D" stroke="#7DA5C9" stroke-width="1"/>
  <text x="512" y="274" fill="#E8E9EB" font-size="12" font-weight="600" text-anchor="middle">auth.middleware.js</text>
  <text x="512" y="290" fill="#7DA5C9" font-size="11" text-anchor="middle">JWT + Live DB Role Lookup</text>

  <rect x="432" y="308" width="161" height="42" rx="5" fill="#1A222D" stroke="#7DA5C9" stroke-width="1"/>
  <text x="512" y="326" fill="#E8E9EB" font-size="12" font-weight="600" text-anchor="middle">roles.middleware.js</text>
  <text x="512" y="341" fill="#7DA5C9" font-size="11" text-anchor="middle">requireRole / Permission</text>

  <rect x="432" y="358" width="161" height="44" rx="5" fill="#1A222D" stroke="#858A93" stroke-width="1"/>
  <text x="512" y="376" fill="#E8E9EB" font-size="12" font-weight="600" text-anchor="middle">upload + turnstile</text>
  <text x="512" y="392" fill="#858A93" font-size="11" text-anchor="middle">Bounded Multer + Cloudflare</text>

  <rect x="432" y="410" width="161" height="42" rx="5" fill="#1A222D" stroke="#858A93" stroke-width="1"/>
  <text x="512" y="428" fill="#E8E9EB" font-size="12" font-weight="600" text-anchor="middle">validation + UUID</text>
  <text x="512" y="443" fill="#858A93" font-size="11" text-anchor="middle">Zod Schema &amp; Param Check</text>

  <!-- Controller -->
  <rect x="630" y="150" width="155" height="315" rx="8" fill="#16181D" stroke="#7DA5C9" stroke-width="1.6"/>
  <text x="707" y="178" fill="#E8E9EB" font-size="14" font-weight="700" text-anchor="middle">Controller</text>
  <text x="707" y="196" fill="#7DA5C9" font-size="11.5" text-anchor="middle">*.controller.js</text>
  <text x="644" y="230" fill="#B6BAC2" font-size="12">• Parse req.params,</text>
  <text x="652" y="248" fill="#B6BAC2" font-size="12">req.query, req.body</text>
  <text x="644" y="276" fill="#B6BAC2" font-size="12">• Multipart Zod parse</text>
  <text x="652" y="294" fill="#B6BAC2" font-size="12">(quotes, visits, boq)</text>
  <text x="644" y="322" fill="#7DA5C9" font-size="12" font-weight="600">• validateUploadedFile</text>
  <text x="652" y="340" fill="#B6BAC2" font-size="11.5">(Magic bytes, Sharp,</text>
  <text x="652" y="356" fill="#B6BAC2" font-size="11.5">CFB XLS, Yauzl XLSX)</text>
  <text x="644" y="384" fill="#B6BAC2" font-size="12">• Public Project</text>
  <text x="652" y="402" fill="#B6BAC2" font-size="12">budget sanitization</text>
  <text x="644" y="432" fill="#858A93" font-size="11.5">*user.controller calls</text>
  <text x="652" y="448" fill="#858A93" font-size="11.5">repositories directly</text>

  <!-- Service -->
  <rect x="810" y="150" width="165" height="315" rx="8" fill="#1A222D" stroke="#7DA5C9" stroke-width="1.8"/>
  <text x="892" y="178" fill="#E8E9EB" font-size="14" font-weight="700" text-anchor="middle">Service Layer</text>
  <text x="892" y="196" fill="#7DA5C9" font-size="11.5" text-anchor="middle">*.service.js</text>
  <text x="824" y="230" fill="#E8E9EB" font-size="12" font-weight="600">Business Logic:</text>
  <text x="824" y="252" fill="#B6BAC2" font-size="12">• Auth JWT &amp; bcrypt</text>
  <text x="824" y="272" fill="#B6BAC2" font-size="12">• Email MX/Disposable</text>
  <text x="824" y="298" fill="#7DA5C9" font-size="12" font-weight="600">External Service Calls:</text>
  <text x="824" y="318" fill="#E8E9EB" font-size="12">• Cloudinary Upload</text>
  <text x="832" y="335" fill="#B6BAC2" font-size="11.5">&amp; Rollback Cleanup</text>
  <text x="824" y="358" fill="#E8E9EB" font-size="12">• Nodemailer Emails</text>
  <text x="832" y="375" fill="#B6BAC2" font-size="11.5">(8 Trigger Points)</text>
  <text x="824" y="415" fill="#858A93" font-size="11.5">*dashboard &amp; sitemap</text>
  <text x="832" y="431" fill="#858A93" font-size="11.5">services query Prisma</text>
  <text x="832" y="447" fill="#858A93" font-size="11.5">directly</text>

  <!-- Repository -->
  <rect x="1000" y="150" width="145" height="175" rx="8" fill="#16181D" stroke="#7DA5C9" stroke-width="1.6"/>
  <text x="1072" y="178" fill="#E8E9EB" font-size="14" font-weight="700" text-anchor="middle">Repository</text>
  <text x="1072" y="196" fill="#7DA5C9" font-size="11.5" text-anchor="middle">*.repository.js</text>
  <text x="1014" y="226" fill="#B6BAC2" font-size="12">• CRUD Queries</text>
  <text x="1014" y="246" fill="#B6BAC2" font-size="12">• Atomic Updates</text>
  <text x="1014" y="266" fill="#B6BAC2" font-size="12">• $transaction</text>
  <text x="1014" y="286" fill="#B6BAC2" font-size="12">• $queryRawUnsafe</text>
  <text x="1022" y="304" fill="#858A93" font-size="11">(Analytics Daily)</text>

  <!-- Prisma Client -->
  <rect x="1000" y="350" width="145" height="115" rx="8" fill="#1A222D" stroke="#7DA5C9" stroke-width="1.8"/>
  <text x="1072" y="380" fill="#E8E9EB" font-size="14" font-weight="700" text-anchor="middle">Prisma Client</text>
  <text x="1072" y="400" fill="#7DA5C9" font-size="11.5" text-anchor="middle">src/utils/prisma.js</text>
  <text x="1072" y="424" fill="#B6BAC2" font-size="12" text-anchor="middle">@prisma/adapter-pg</text>
  <text x="1072" y="444" fill="#858A93" font-size="12" text-anchor="middle">+ pg.Pool</text>

  <!-- ==================== 3. EXTERNAL SERVICES & DATABASE ==================== -->
  <!-- Cloudflare Turnstile -->
  <rect x="375" y="545" width="235" height="165" rx="10" fill="#16181D" stroke="#858A93" stroke-width="1.5"/>
  <text x="492" y="575" fill="#E8E9EB" font-size="14.5" font-weight="700" text-anchor="middle">Cloudflare Turnstile</text>
  <text x="492" y="596" fill="#858A93" font-size="12" text-anchor="middle">challenges.cloudflare.com</text>
  <text x="392" y="625" fill="#B6BAC2" font-size="12">• Called by verifyTurnstile</text>
  <text x="400" y="643" fill="#B6BAC2" font-size="12">middleware on public</text>
  <text x="400" y="661" fill="#B6BAC2" font-size="12">POST /quotes, /visits,</text>
  <text x="400" y="679" fill="#B6BAC2" font-size="12">/boq, and /contact</text>

  <!-- Cloudinary -->
  <rect x="630" y="545" width="175" height="165" rx="10" fill="#181C22" stroke="#7DA5C9" stroke-width="1.6"/>
  <text x="717" y="575" fill="#E8E9EB" font-size="14.5" font-weight="700" text-anchor="middle">Cloudinary API</text>
  <text x="717" y="596" fill="#7DA5C9" font-size="12" text-anchor="middle">src/config/storage.js</text>
  <text x="644" y="624" fill="#B6BAC2" font-size="12">• Called from Service:</text>
  <text x="650" y="643" fill="#B6BAC2" font-size="11.5">- quote/visit/boq.service</text>
  <text x="650" y="660" fill="#B6BAC2" font-size="11.5">- image/catalog.service</text>
  <text x="650" y="677" fill="#B6BAC2" font-size="11.5">- cloudinaryCleanup.js</text>
  <text x="650" y="694" fill="#7DA5C9" font-size="11.5">(upload_stream/destroy)</text>

  <!-- Nodemailer -->
  <rect x="820" y="545" width="165" height="165" rx="10" fill="#181C22" stroke="#7DA5C9" stroke-width="1.6"/>
  <text x="902" y="575" fill="#E8E9EB" font-size="14.5" font-weight="700" text-anchor="middle">Nodemailer SMTP</text>
  <text x="902" y="596" fill="#7DA5C9" font-size="12" text-anchor="middle">src/utils/mailer.js</text>
  <text x="832" y="624" fill="#B6BAC2" font-size="12">• Yahoo SMTP :465 SSL</text>
  <text x="832" y="643" fill="#B6BAC2" font-size="12">• Called from Service:</text>
  <text x="838" y="661" fill="#B6BAC2" font-size="11.5">- auth.service (Verify</text>
  <text x="846" y="677" fill="#B6BAC2" font-size="11.5">&amp; Password Reset)</text>
  <text x="838" y="694" fill="#B6BAC2" font-size="11.5">- quote/visit/boq/contact</text>

  <!-- PostgreSQL -->
  <rect x="1000" y="545" width="165" height="165" rx="10" fill="#1A222D" stroke="#7DA5C9" stroke-width="2"/>
  <text x="1082" y="578" fill="#E8E9EB" font-size="15.5" font-weight="700" text-anchor="middle">PostgreSQL</text>
  <text x="1082" y="600" fill="#7DA5C9" font-size="12.5" text-anchor="middle">Primary Relational DB</text>
  <text x="1016" y="630" fill="#B6BAC2" font-size="12">• 15 Prisma Models</text>
  <text x="1016" y="650" fill="#B6BAC2" font-size="12">• UUID Primary Keys</text>
  <text x="1016" y="670" fill="#B6BAC2" font-size="12">• Cascade Relations</text>
  <text x="1016" y="690" fill="#B6BAC2" font-size="12">• Row-Locked Counters</text>

  <!-- ==================== CONNECTORS ==================== -->
  <!-- Clients to Routes -->
  <line x1="200" y1="218" x2="258" y2="218" stroke="#7DA5C9" stroke-width="1.8" marker-end="url(#arrow-accent)"/>
  <line x1="200" y1="392" x2="258" y2="392" stroke="#7DA5C9" stroke-width="1.8" marker-end="url(#arrow-accent)"/>

  <!-- Routes -> Middleware -> Controller -> Service -> Repository -->
  <line x1="395" y1="305" x2="418" y2="305" stroke="#7DA5C9" stroke-width="1.8" marker-end="url(#arrow-accent)"/>
  <line x1="605" y1="305" x2="628" y2="305" stroke="#7DA5C9" stroke-width="1.8" marker-end="url(#arrow-accent)"/>
  <line x1="785" y1="305" x2="808" y2="305" stroke="#7DA5C9" stroke-width="1.8" marker-end="url(#arrow-accent)"/>
  <line x1="975" y1="235" x2="998" y2="235" stroke="#7DA5C9" stroke-width="1.8" marker-end="url(#arrow-accent)"/>

  <!-- Repository -> Prisma -> PostgreSQL -->
  <line x1="1072" y1="325" x2="1072" y2="348" stroke="#7DA5C9" stroke-width="1.8" marker-end="url(#arrow-accent)"/>
  <line x1="1072" y1="465" x2="1072" y2="543" stroke="#7DA5C9" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <!-- Service -> Prisma (direct for dashboard & sitemap) -->
  <line x1="975" y1="425" x2="998" y2="425" stroke="#858A93" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- Middleware (Turnstile) -> Cloudflare -->
  <line x1="512" y1="465" x2="512" y2="543" stroke="#858A93" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- Service -> Cloudinary & Nodemailer -->
  <path d="M 850 465 L 850 510 L 717 510 L 717 543" fill="none" stroke="#7DA5C9" stroke-width="1.8" marker-end="url(#arrow-accent)"/>
  <line x1="902" y1="465" x2="902" y2="543" stroke="#7DA5C9" stroke-width="1.8" marker-end="url(#arrow-accent)"/>
</svg>
