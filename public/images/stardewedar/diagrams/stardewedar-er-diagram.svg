<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" width="1200" height="940" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- Background -->
  <rect width="1200" height="940" fill="#101113"/>

  <!-- Header -->
  <text x="40" y="46" fill="#E8E9EB" font-size="22" font-weight="700" letter-spacing="-0.3">StarDewedar — Entity-Relationship Diagram (PostgreSQL + Prisma)</text>
  <text x="40" y="70" fill="#858A93" font-size="14">All 15 models from backend/prisma/schema.prisma • Primary keys (PK), foreign keys (FK), unique keys (UK), and cardinalities</text>

  <!-- ==================== RELATIONSHIP LINES (Drawn Behind Boxes) ==================== -->
  <!-- User (170,155) -> SavedProduct (450,155) : 1 to 0..N -->
  <line x1="290" y1="155" x2="360" y2="155" stroke="#7DA5C9" stroke-width="1.8"/>
  <text x="302" y="146" fill="#7DA5C9" font-size="12" font-weight="700">1</text>
  <text x="335" y="146" fill="#7DA5C9" font-size="12" font-weight="700">0..*</text>

  <!-- User (170,210) -> Conversation (170,350) : 1 to 0..N -->
  <line x1="170" y1="220" x2="170" y2="330" stroke="#7DA5C9" stroke-width="1.8"/>
  <text x="180" y="242" fill="#7DA5C9" font-size="12" font-weight="700">1</text>
  <text x="180" y="320" fill="#7DA5C9" font-size="12" font-weight="700">0..*</text>

  <!-- Conversation (170,440) -> Message (170,560) : 1 to 0..N -->
  <line x1="170" y1="440" x2="170" y2="550" stroke="#7DA5C9" stroke-width="1.8"/>
  <text x="180" y="462" fill="#7DA5C9" font-size="12" font-weight="700">1</text>
  <text x="180" y="540" fill="#7DA5C9" font-size="12" font-weight="700">0..*</text>

  <!-- Product (480,385) -> SavedProduct (480,220) : 1 to 0..N -->
  <line x1="480" y1="330" x2="480" y2="230" stroke="#7DA5C9" stroke-width="1.8"/>
  <text x="490" y="318" fill="#7DA5C9" font-size="12" font-weight="700">1</text>
  <text x="490" y="248" fill="#7DA5C9" font-size="12" font-weight="700">0..*</text>

  <!-- Product (360,415) -> Message (290,605) : 0..1 to 0..N -->
  <path d="M 360 415 L 325 415 L 325 605 L 290 605" fill="none" stroke="#858A93" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="332" y="406" fill="#858A93" font-size="12" font-weight="600">0..1</text>
  <text x="298" y="596" fill="#858A93" font-size="12" font-weight="600">0..*</text>

  <!-- Category (800,155) -> Product (600,365) : 1 to 0..N -->
  <path d="M 680 155 L 640 155 L 640 365 L 600 365" fill="none" stroke="#7DA5C9" stroke-width="1.8"/>
  <text x="662" y="146" fill="#7DA5C9" font-size="12" font-weight="700">1</text>
  <text x="608" y="356" fill="#7DA5C9" font-size="12" font-weight="700">0..*</text>

  <!-- Category (920,155) -> Project (960,155) : 0..1 to 0..N -->
  <line x1="920" y1="155" x2="960" y2="155" stroke="#858A93" stroke-width="1.8" stroke-dasharray="4 3"/>
  <text x="923" y="146" fill="#858A93" font-size="11.5" font-weight="600">0..1</text>
  <text x="938" y="172" fill="#858A93" font-size="11.5" font-weight="600">0..*</text>

  <!-- Project (1060,220) -> ProjectImage (1060,330) : 1 to 0..N -->
  <line x1="1060" y1="220" x2="1060" y2="330" stroke="#7DA5C9" stroke-width="1.8"/>
  <text x="1070" y="242" fill="#7DA5C9" font-size="12" font-weight="700">1</text>
  <text x="1070" y="320" fill="#7DA5C9" font-size="12" font-weight="700">0..*</text>

  <!-- Product (600,395) -> ProductImage (680,355) : 1 to 0..N -->
  <path d="M 600 385 L 640 385 L 640 365 L 680 365" fill="none" stroke="#7DA5C9" stroke-width="1.8"/>
  <text x="608" y="378" fill="#7DA5C9" font-size="12" font-weight="700">1</text>
  <text x="653" y="358" fill="#7DA5C9" font-size="12" font-weight="700">0..*</text>

  <!-- Product (600,415) -> ProductCatalog (680,505) : 1 to 0..N -->
  <path d="M 600 415 L 640 415 L 640 505 L 680 505" fill="none" stroke="#7DA5C9" stroke-width="1.8"/>
  <text x="608" y="432" fill="#7DA5C9" font-size="12" font-weight="700">1</text>
  <text x="653" y="497" fill="#7DA5C9" font-size="12" font-weight="700">0..*</text>

  <!-- Product (480,440) -> QuoteRequest (480,550) : 0..1 to 0..N -->
  <line x1="480" y1="440" x2="480" y2="550" stroke="#858A93" stroke-width="1.8" stroke-dasharray="4 3"/>
  <text x="490" y="462" fill="#858A93" font-size="12" font-weight="600">0..1</text>
  <text x="490" y="540" fill="#858A93" font-size="12" font-weight="600">0..*</text>

  <!-- ==================== ENTITY BOXES ==================== -->

  <!-- 1. User -->
  <g transform="translate(50, 100)">
    <rect width="240" height="120" rx="8" fill="#16181D" stroke="#7DA5C9" stroke-width="1.8"/>
    <rect width="240" height="34" rx="8" fill="#1A222D"/>
    <text x="120" y="22" fill="#E8E9EB" font-size="15" font-weight="700" text-anchor="middle">User</text>
    <text x="16" y="58" fill="#7DA5C9" font-size="13" font-weight="600">PK</text>
    <text x="52" y="58" fill="#E8E9EB" font-size="13">id : UUID</text>
    <text x="16" y="82" fill="#858A93" font-size="13" font-weight="600">UK</text>
    <text x="52" y="82" fill="#E8E9EB" font-size="13">email : String</text>
    <text x="52" y="104" fill="#B6BAC2" font-size="12.5">role, hashed_refresh_token</text>
  </g>

  <!-- 2. SavedProduct -->
  <g transform="translate(360, 100)">
    <rect width="240" height="130" rx="8" fill="#16181D" stroke="#7DA5C9" stroke-width="1.8"/>
    <rect width="240" height="34" rx="8" fill="#1A222D"/>
    <text x="120" y="22" fill="#E8E9EB" font-size="15" font-weight="700" text-anchor="middle">SavedProduct</text>
    <text x="16" y="58" fill="#7DA5C9" font-size="13" font-weight="600">PK</text>
    <text x="52" y="58" fill="#E8E9EB" font-size="13">id : UUID</text>
    <text x="16" y="82" fill="#7DA5C9" font-size="13" font-weight="600">FK</text>
    <text x="52" y="82" fill="#E8E9EB" font-size="13">user_id → User.id</text>
    <text x="16" y="104" fill="#7DA5C9" font-size="13" font-weight="600">FK</text>
    <text x="52" y="104" fill="#E8E9EB" font-size="13">product_id → Product.id</text>
    <text x="52" y="122" fill="#858A93" font-size="11.5">@@unique([user_id, product_id])</text>
  </g>

  <!-- 3. Category -->
  <g transform="translate(680, 100)">
    <rect width="240" height="110" rx="8" fill="#16181D" stroke="#7DA5C9" stroke-width="1.8"/>
    <rect width="240" height="34" rx="8" fill="#1A222D"/>
    <text x="120" y="22" fill="#E8E9EB" font-size="15" font-weight="700" text-anchor="middle">Category</text>
    <text x="16" y="58" fill="#7DA5C9" font-size="13" font-weight="600">PK</text>
    <text x="52" y="58" fill="#E8E9EB" font-size="13">id : UUID</text>
    <text x="52" y="82" fill="#B6BAC2" font-size="13">name_en, name_ar</text>
    <text x="52" y="101" fill="#858A93" font-size="12.5">type : String</text>
  </g>

  <!-- 4. Project -->
  <g transform="translate(960, 100)">
    <rect width="200" height="120" rx="8" fill="#16181D" stroke="#7DA5C9" stroke-width="1.8"/>
    <rect width="200" height="34" rx="8" fill="#1A222D"/>
    <text x="100" y="22" fill="#E8E9EB" font-size="15" font-weight="700" text-anchor="middle">Project</text>
    <text x="14" y="58" fill="#7DA5C9" font-size="13" font-weight="600">PK</text>
    <text x="46" y="58" fill="#E8E9EB" font-size="13">id : UUID</text>
    <text x="14" y="82" fill="#858A93" font-size="13" font-weight="600">FK?</text>
    <text x="46" y="82" fill="#E8E9EB" font-size="13">category_id (null)</text>
    <text x="46" y="104" fill="#B6BAC2" font-size="12">title_en/ar, budget</text>
  </g>

  <!-- 5. Conversation -->
  <g transform="translate(50, 330)">
    <rect width="240" height="110" rx="8" fill="#16181D" stroke="#7DA5C9" stroke-width="1.8"/>
    <rect width="240" height="34" rx="8" fill="#1A222D"/>
    <text x="120" y="22" fill="#E8E9EB" font-size="15" font-weight="700" text-anchor="middle">Conversation</text>
    <text x="16" y="58" fill="#7DA5C9" font-size="13" font-weight="600">PK</text>
    <text x="52" y="58" fill="#E8E9EB" font-size="13">id : UUID</text>
    <text x="16" y="82" fill="#7DA5C9" font-size="13" font-weight="600">FK</text>
    <text x="52" y="82" fill="#E8E9EB" font-size="13">customer_id → User.id</text>
    <text x="52" y="102" fill="#858A93" font-size="12">subject, status (OPEN/CLOSED)</text>
  </g>

  <!-- 6. Product -->
  <g transform="translate(360, 330)">
    <rect width="240" height="110" rx="8" fill="#16181D" stroke="#7DA5C9" stroke-width="1.8"/>
    <rect width="240" height="34" rx="8" fill="#1A222D"/>
    <text x="120" y="22" fill="#E8E9EB" font-size="15" font-weight="700" text-anchor="middle">Product</text>
    <text x="16" y="58" fill="#7DA5C9" font-size="13" font-weight="600">PK</text>
    <text x="52" y="58" fill="#E8E9EB" font-size="13">id : UUID</text>
    <text x="16" y="82" fill="#7DA5C9" font-size="13" font-weight="600">FK</text>
    <text x="52" y="82" fill="#E8E9EB" font-size="13">category_id → Category.id</text>
    <text x="52" y="102" fill="#B6BAC2" font-size="12">name_en/ar, price</text>
  </g>

  <!-- 7. ProductImage -->
  <g transform="translate(680, 315)">
    <rect width="240" height="100" rx="8" fill="#16181D" stroke="#7DA5C9" stroke-width="1.8"/>
    <rect width="240" height="34" rx="8" fill="#1A222D"/>
    <text x="120" y="22" fill="#E8E9EB" font-size="15" font-weight="700" text-anchor="middle">ProductImage</text>
    <text x="16" y="58" fill="#7DA5C9" font-size="13" font-weight="600">PK</text>
    <text x="52" y="58" fill="#E8E9EB" font-size="13">id : UUID</text>
    <text x="16" y="82" fill="#7DA5C9" font-size="13" font-weight="600">FK</text>
    <text x="52" y="82" fill="#E8E9EB" font-size="13">product_id → Product.id</text>
  </g>

  <!-- 8. ProjectImage -->
  <g transform="translate(960, 330)">
    <rect width="200" height="100" rx="8" fill="#16181D" stroke="#7DA5C9" stroke-width="1.8"/>
    <rect width="200" height="34" rx="8" fill="#1A222D"/>
    <text x="100" y="22" fill="#E8E9EB" font-size="15" font-weight="700" text-anchor="middle">ProjectImage</text>
    <text x="14" y="58" fill="#7DA5C9" font-size="13" font-weight="600">PK</text>
    <text x="46" y="58" fill="#E8E9EB" font-size="13">id : UUID</text>
    <text x="14" y="82" fill="#7DA5C9" font-size="13" font-weight="600">FK</text>
    <text x="46" y="82" fill="#E8E9EB" font-size="13">project_id → Project.id</text>
  </g>

  <!-- 9. ProductCatalog -->
  <g transform="translate(680, 455)">
    <rect width="240" height="100" rx="8" fill="#16181D" stroke="#7DA5C9" stroke-width="1.8"/>
    <rect width="240" height="34" rx="8" fill="#1A222D"/>
    <text x="120" y="22" fill="#E8E9EB" font-size="15" font-weight="700" text-anchor="middle">ProductCatalog</text>
    <text x="16" y="58" fill="#7DA5C9" font-size="13" font-weight="600">PK</text>
    <text x="52" y="58" fill="#E8E9EB" font-size="13">id : UUID</text>
    <text x="16" y="82" fill="#7DA5C9" font-size="13" font-weight="600">FK</text>
    <text x="52" y="82" fill="#E8E9EB" font-size="13">product_id → Product.id</text>
  </g>

  <!-- 10. Message -->
  <g transform="translate(50, 550)">
    <rect width="240" height="125" rx="8" fill="#16181D" stroke="#7DA5C9" stroke-width="1.8"/>
    <rect width="240" height="34" rx="8" fill="#1A222D"/>
    <text x="120" y="22" fill="#E8E9EB" font-size="15" font-weight="700" text-anchor="middle">Message</text>
    <text x="16" y="58" fill="#7DA5C9" font-size="13" font-weight="600">PK</text>
    <text x="52" y="58" fill="#E8E9EB" font-size="13">id : UUID</text>
    <text x="16" y="82" fill="#7DA5C9" font-size="13" font-weight="600">FK</text>
    <text x="52" y="82" fill="#E8E9EB" font-size="13">conversation_id</text>
    <text x="16" y="106" fill="#858A93" font-size="13" font-weight="600">FK?</text>
    <text x="52" y="106" fill="#E8E9EB" font-size="13">product_id (nullable)</text>
  </g>

  <!-- 11. QuoteRequest -->
  <g transform="translate(360, 550)">
    <rect width="240" height="125" rx="8" fill="#16181D" stroke="#7DA5C9" stroke-width="1.8"/>
    <rect width="240" height="34" rx="8" fill="#1A222D"/>
    <text x="120" y="22" fill="#E8E9EB" font-size="15" font-weight="700" text-anchor="middle">QuoteRequest</text>
    <text x="16" y="58" fill="#7DA5C9" font-size="13" font-weight="600">PK</text>
    <text x="52" y="58" fill="#E8E9EB" font-size="13">id : UUID</text>
    <text x="16" y="82" fill="#858A93" font-size="13" font-weight="600">FK?</text>
    <text x="52" y="82" fill="#E8E9EB" font-size="13">product_id (nullable)</text>
    <text x="52" y="106" fill="#B6BAC2" font-size="12">email, file_url, status</text>
  </g>

  <!-- ==================== STANDALONE MODELS (NO PRISMA FK RELATIONS) ==================== -->
  <rect x="40" y="715" width="1120" height="190" rx="10" fill="#141619" stroke="#858A93" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="60" y="742" fill="#7DA5C9" font-size="13.5" font-weight="700" letter-spacing="0.8">STANDALONE TABLES IN SCHEMA.PRISMA (NO FOREIGN KEY CONSTRAINTS)</text>
  <text x="565" y="742" fill="#858A93" font-size="12.5">(Note: User "My Requests" queries match QuoteRequest / VisitRequest / BOQRequest by email)</text>

  <!-- 12. VisitRequest -->
  <g transform="translate(60, 762)">
    <rect width="250" height="120" rx="8" fill="#16181D" stroke="#858A93" stroke-width="1.6"/>
    <rect width="250" height="34" rx="8" fill="#1A222D"/>
    <text x="125" y="22" fill="#E8E9EB" font-size="15" font-weight="700" text-anchor="middle">VisitRequest</text>
    <text x="16" y="58" fill="#7DA5C9" font-size="13" font-weight="600">PK</text>
    <text x="52" y="58" fill="#E8E9EB" font-size="13">id : UUID</text>
    <text x="52" y="82" fill="#B6BAC2" font-size="12.5">factory_name, preferred_date</text>
    <text x="52" y="103" fill="#858A93" font-size="12.5">email, file_url, status</text>
  </g>

  <!-- 13. BOQRequest -->
  <g transform="translate(335, 762)">
    <rect width="255" height="120" rx="8" fill="#16181D" stroke="#858A93" stroke-width="1.6"/>
    <rect width="255" height="34" rx="8" fill="#1A222D"/>
    <text x="127" y="22" fill="#E8E9EB" font-size="15" font-weight="700" text-anchor="middle">BOQRequest</text>
    <text x="16" y="58" fill="#7DA5C9" font-size="13" font-weight="600">PK</text>
    <text x="52" y="58" fill="#E8E9EB" font-size="13">id : UUID</text>
    <text x="52" y="82" fill="#B6BAC2" font-size="12.5">boq_file_url, supporting_docs_urls</text>
    <text x="52" y="103" fill="#858A93" font-size="12.5">email, project_type, status</text>
  </g>

  <!-- 14. ContactMessage -->
  <g transform="translate(615, 762)">
    <rect width="250" height="120" rx="8" fill="#16181D" stroke="#858A93" stroke-width="1.6"/>
    <rect width="250" height="34" rx="8" fill="#1A222D"/>
    <text x="125" y="22" fill="#E8E9EB" font-size="15" font-weight="700" text-anchor="middle">ContactMessage</text>
    <text x="16" y="58" fill="#7DA5C9" font-size="13" font-weight="600">PK</text>
    <text x="52" y="58" fill="#E8E9EB" font-size="13">id : UUID</text>
    <text x="52" y="82" fill="#B6BAC2" font-size="12.5">first_name, last_name, email</text>
    <text x="52" y="103" fill="#858A93" font-size="12.5">message, created_at (no status)</text>
  </g>

  <!-- 15. AnalyticsSession -->
  <g transform="translate(890, 762)">
    <rect width="250" height="120" rx="8" fill="#16181D" stroke="#858A93" stroke-width="1.6"/>
    <rect width="250" height="34" rx="8" fill="#1A222D"/>
    <text x="125" y="22" fill="#E8E9EB" font-size="15" font-weight="700" text-anchor="middle">AnalyticsSession</text>
    <text x="16" y="58" fill="#7DA5C9" font-size="13" font-weight="600">PK</text>
    <text x="52" y="58" fill="#E8E9EB" font-size="13">id : UUID</text>
    <text x="16" y="82" fill="#858A93" font-size="13" font-weight="600">UK</text>
    <text x="52" y="82" fill="#E8E9EB" font-size="13">session_id : String</text>
    <text x="52" y="103" fill="#858A93" font-size="12.5">ip_hash, first_seen_at, last_seen_at</text>
  </g>
</svg>
