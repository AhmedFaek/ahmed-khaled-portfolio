<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#858A93"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#7DA5C9"/>
    </marker>
    <marker id="arrow-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#D97373"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="820" fill="#101113"/>

  <!-- Header -->
  <text x="40" y="46" fill="#E8E9EB" font-size="22" font-weight="700" letter-spacing="-0.3">StarDewedar — Customer Request Workflow (Quote, Site Visit &amp; Separate BOQ)</text>
  <text x="40" y="70" fill="#858A93" font-size="14">Derived from backend/src/modules/{quoteRequests,visitRequests,boqRequests}/* — BOQ is a dedicated module &amp; table (BOQRequest)</text>

  <!-- ==================== ROW 1: 3 SEPARATE ENTRY POINTS ==================== -->
  <rect x="40" y="96" width="350" height="115" rx="8" fill="#16181D" stroke="#7DA5C9" stroke-width="1.6"/>
  <text x="215" y="124" fill="#E8E9EB" font-size="15" font-weight="700" text-anchor="middle">1A. Quote Request</text>
  <text x="215" y="145" fill="#7DA5C9" font-size="13" font-weight="600" text-anchor="middle">POST /api/quotes → QuoteRequest</text>
  <text x="215" y="168" fill="#B6BAC2" font-size="12.5" text-anchor="middle">Requires product_id OR custom_product_name</text>
  <text x="215" y="188" fill="#858A93" font-size="12" text-anchor="middle">Optional single file (.pdf, .jpg, .png ≤ 10 MB)</text>

  <rect x="425" y="96" width="350" height="115" rx="8" fill="#16181D" stroke="#7DA5C9" stroke-width="1.6"/>
  <text x="600" y="124" fill="#E8E9EB" font-size="15" font-weight="700" text-anchor="middle">1B. Site Visit Request</text>
  <text x="600" y="145" fill="#7DA5C9" font-size="13" font-weight="600" text-anchor="middle">POST /api/visits → VisitRequest</text>
  <text x="600" y="168" fill="#B6BAC2" font-size="12.5" text-anchor="middle">factory_name, activity, address, preferred_date</text>
  <text x="600" y="188" fill="#858A93" font-size="12" text-anchor="middle">Optional single file (.pdf, .jpg, .png ≤ 10 MB)</text>

  <rect x="810" y="96" width="350" height="115" rx="8" fill="#1A222D" stroke="#7DA5C9" stroke-width="1.8"/>
  <text x="985" y="124" fill="#E8E9EB" font-size="15" font-weight="700" text-anchor="middle">1C. BOQ Request (Separate Entity)</text>
  <text x="985" y="145" fill="#7DA5C9" font-size="13" font-weight="600" text-anchor="middle">POST /api/boq → BOQRequest</text>
  <text x="985" y="168" fill="#B6BAC2" font-size="12.5" text-anchor="middle">1 required boq_file + up to 5 supporting_docs</text>
  <text x="985" y="188" fill="#858A93" font-size="12" text-anchor="middle">.pdf, .xls, .xlsx, .csv (≤ 20 MB/file, 120 MB total)</text>

  <!-- Converging arrows -->
  <path d="M 215 211 L 215 235 L 600 235 L 600 252" fill="none" stroke="#7DA5C9" stroke-width="1.6"/>
  <line x1="600" y1="211" x2="600" y2="252" stroke="#7DA5C9" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
  <path d="M 985 211 L 985 235 L 600 235" fill="none" stroke="#7DA5C9" stroke-width="1.6"/>

  <!-- ==================== ROW 2: MIDDLEWARE & VALIDATION ==================== -->
  <rect x="40" y="255" width="1120" height="150" rx="10" fill="#15171B" stroke="#858A93" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="60" y="281" fill="#7DA5C9" font-size="13.5" font-weight="700" letter-spacing="0.8">2. SECURITY GUARD, MULTIPART PARSING &amp; VALIDATION PIPELINE</text>

  <rect x="60" y="298" width="235" height="88" rx="8" fill="#181A1F" stroke="#858A93" stroke-width="1.5"/>
  <text x="177" y="324" fill="#E8E9EB" font-size="13.5" font-weight="700" text-anchor="middle">Rate Limiter + Body Cap</text>
  <text x="177" y="345" fill="#B6BAC2" font-size="12" text-anchor="middle">• 5 submissions / hour / IP</text>
  <text x="177" y="364" fill="#B6BAC2" font-size="12" text-anchor="middle">• Bounded memory stream</text>
  <text x="177" y="380" fill="#858A93" font-size="11.5" text-anchor="middle">(429 Too Many / 413 Oversized)</text>

  <line x1="295" y1="342" x2="335" y2="342" stroke="#7DA5C9" stroke-width="1.5" marker-end="url(#arrow-accent)"/>

  <rect x="345" y="298" width="255" height="88" rx="8" fill="#181A1F" stroke="#858A93" stroke-width="1.5"/>
  <text x="472" y="324" fill="#E8E9EB" font-size="13.5" font-weight="700" text-anchor="middle">verifyTurnstile Middleware</text>
  <text x="472" y="345" fill="#B6BAC2" font-size="12" text-anchor="middle">• Verifies turnstileToken via</text>
  <text x="472" y="363" fill="#B6BAC2" font-size="12" text-anchor="middle">Cloudflare Siteverify API</text>
  <text x="472" y="380" fill="#858A93" font-size="11.5" text-anchor="middle">• Strips token before Zod parse</text>

  <line x1="600" y1="342" x2="640" y2="342" stroke="#7DA5C9" stroke-width="1.5" marker-end="url(#arrow-accent)"/>

  <rect x="650" y="298" width="490" height="88" rx="8" fill="#1A222D" stroke="#7DA5C9" stroke-width="1.6"/>
  <text x="895" y="324" fill="#E8E9EB" font-size="13.5" font-weight="700" text-anchor="middle">Controller: Zod Schema + Byte-Level File Validation</text>
  <text x="895" y="345" fill="#B6BAC2" font-size="12" text-anchor="middle">1. createQuoteRequestSchema / createVisitRequestSchema / createBOQRequestSchema</text>
  <text x="895" y="364" fill="#7DA5C9" font-size="12" text-anchor="middle">2. validateUploadedFile(): PDF structure, Sharp JPEG/PNG decode, CFB XLS, Yauzl XLSX</text>
  <text x="895" y="380" fill="#858A93" font-size="11.5" text-anchor="middle">(Invalid input or file bytes → 400 Bad Request before any Cloudinary call)</text>

  <line x1="600" y1="405" x2="600" y2="435" stroke="#7DA5C9" stroke-width="1.8" marker-end="url(#arrow-accent)"/>

  <!-- ==================== ROW 3: SERVICE PERSISTENCE & EMAIL ==================== -->
  <rect x="40" y="440" width="1120" height="160" rx="10" fill="#15171B" stroke="#7DA5C9" stroke-width="1.2"/>
  <text x="60" y="466" fill="#7DA5C9" font-size="13.5" font-weight="700" letter-spacing="0.8">3. SERVICE LAYER: CLOUDINARY STREAM, DB PERSISTENCE &amp; EMAIL NOTIFICATION</text>

  <rect x="60" y="484" width="330" height="96" rx="8" fill="#16181D" stroke="#7DA5C9" stroke-width="1.6"/>
  <text x="225" y="510" fill="#E8E9EB" font-size="14" font-weight="700" text-anchor="middle">Step A: Upload to Cloudinary</text>
  <text x="225" y="531" fill="#B6BAC2" font-size="12" text-anchor="middle">• upload_stream (resource_type: 'auto')</text>
  <text x="225" y="550" fill="#B6BAC2" font-size="12" text-anchor="middle">• BOQ uses settleCloudinaryUploads():</text>
  <text x="225" y="567" fill="#858A93" font-size="11.5" text-anchor="middle">destroys partial uploads if any file fails</text>

  <line x1="390" y1="532" x2="430" y2="532" stroke="#7DA5C9" stroke-width="1.6" marker-end="url(#arrow-accent)"/>

  <rect x="440" y="484" width="335" height="96" rx="8" fill="#1A222D" stroke="#7DA5C9" stroke-width="1.8"/>
  <text x="607" y="510" fill="#E8E9EB" font-size="14" font-weight="700" text-anchor="middle">Step B: Save to PostgreSQL</text>
  <text x="607" y="531" fill="#7DA5C9" font-size="12.5" font-weight="600" text-anchor="middle">persistWithCloudinaryCleanup()</text>
  <text x="607" y="550" fill="#B6BAC2" font-size="12" text-anchor="middle">• Inserts row with status = 'pending'</text>
  <text x="607" y="567" fill="#858A93" font-size="11.5" text-anchor="middle">• On DB failure → destroys Cloudinary assets</text>

  <line x1="775" y1="532" x2="815" y2="532" stroke="#7DA5C9" stroke-width="1.6" marker-end="url(#arrow-accent)"/>

  <rect x="825" y="484" width="315" height="96" rx="8" fill="#16181D" stroke="#7DA5C9" stroke-width="1.6"/>
  <text x="982" y="510" fill="#E8E9EB" font-size="14" font-weight="700" text-anchor="middle">Step C: Email Notification</text>
  <text x="982" y="531" fill="#B6BAC2" font-size="12" text-anchor="middle">• buildNotificationEmail() + Yahoo SMTP</text>
  <text x="982" y="550" fill="#B6BAC2" font-size="12" text-anchor="middle">• Deep link: /requests?tab=quote|visit|boq</text>
  <text x="982" y="567" fill="#858A93" font-size="11.5" text-anchor="middle">• SMTP errors caught &amp; logged; 201 returned</text>

  <line x1="600" y1="600" x2="600" y2="630" stroke="#7DA5C9" stroke-width="1.8" marker-end="url(#arrow-accent)"/>

  <!-- ==================== ROW 4: ADMIN INBOX & CUSTOMER TRACKING ==================== -->
  <rect x="40" y="635" width="720" height="145" rx="10" fill="#181C22" stroke="#7DA5C9" stroke-width="1.6"/>
  <text x="60" y="663" fill="#7DA5C9" font-size="13.5" font-weight="700" letter-spacing="0.8">4A. ADMIN REQUESTS INBOX (AllRequests.jsx — /requests)</text>
  <text x="60" y="688" fill="#E8E9EB" font-size="13.5" font-weight="600">Accessible to: Sales &amp; Support Manager (sales_support_manager) and Super Admin (super_admin)</text>
  <text x="60" y="712" fill="#B6BAC2" font-size="12.5">• Protected by auth + requirePermission('requests:manage')</text>
  <text x="60" y="734" fill="#B6BAC2" font-size="12.5">• View customer details, download Cloudinary attachments, filter by tab &amp; status</text>
  <text x="60" y="756" fill="#7DA5C9" font-size="12.5" font-weight="600">• Update status (PUT /:id): pending → contacted | in_progress | completed | closed | rejected</text>

  <rect x="785" y="635" width="375" height="145" rx="10" fill="#16181D" stroke="#858A93" stroke-width="1.5"/>
  <text x="805" y="663" fill="#E8E9EB" font-size="13.5" font-weight="700" letter-spacing="0.5">4B. CUSTOMER "MY REQUESTS" PANEL</text>
  <text x="805" y="688" fill="#B6BAC2" font-size="12.5">Authenticated customers can track status via:</text>
  <text x="805" y="712" fill="#7DA5C9" font-size="12.5">• GET /api/users/me/quotes</text>
  <text x="805" y="732" fill="#7DA5C9" font-size="12.5">• GET /api/users/me/visits</text>
  <text x="805" y="752" fill="#7DA5C9" font-size="12.5">• GET /api/users/me/boq</text>
  <text x="805" y="770" fill="#858A93" font-size="11.5">(Matched by authenticated user's email address)</text>
</svg>
